acceptance:
  - id: A1
    source: brief.md
    text: "A1: Re-entering Preview for an unchanged project in the same session
      reuses a valid memory model without the four whole-project source reads,
      model reconstruction, or a redundant loading placeholder; valid card DOM
      is reused where applicable."
    result: passed
    reason:
      text: Memory-hit implementation and Runtime-executed regressions establish
        unchanged model reuse without additional whole-project reads, builds, or
        snapshot writes. Applicable DOM restoration preserves node identity; the
        warm path does not set a loading placeholder.
      truncated: false
  - id: A2
    source: brief.md
    text: "A2: After reopening the app/project, a valid project-owned persistent
      snapshot is read with lightweight validity metadata and rendered without
      whole-project source fetching or model reconstruction."
    result: passed
    reason:
      text: Project SQLite snapshots restore through versioned metadata without
        whole-project reads or reconstruction. Frontend restart-equivalent and
        backend persisted-hit regressions passed; memory-valid backend reads
        omit the snapshot payload.
      truncated: false
  - id: A3
    source: brief.md
    text: "A3: A project with no usable cache follows the existing
      full-read/normalize/build path, presents the correct preview, and saves a
      reusable derived snapshot when persistence is available."
    result: passed
    reason:
      text: Cold loading performs the four source reads, normalizes saved/baseline
        paths, builds cards, and publishes a compact saved-content snapshot when
        validity permits. Executed cold-load assertions confirm this sequence.
      truncated: false
  - id: A4
    source: brief.md
    text: "A4: Relevant Final Path, gap, source-contig
      structure/orientation/assignment/name, dataset, reference, baseline, or
      phased-track changes (including undo/redo and supported import/copy paths)
      invalidate affected snapshots before they can be presented as current."
    result: passed
    reason:
      text: Transactional SQL triggers cover the inspected semantic dependencies,
        including actual editor undo/redo and old/new source assignments. The
        repaired schema/tracking version 3 includes source_seq_n_region
        INSERT/UPDATE/DELETE; passing regressions exercise actual GRT gap
        repartitioning, obsolete-publication rejection, and v2 cache upgrade.
      truncated: false
  - id: A5
    source: brief.md
    text: "A5: Navigation, scrolling, view zoom, hover, locale, font, and pure
      view-state saves do not invalidate semantic preview data; presentation
      changes still update the rendered result."
    result: passed
    reason:
      text: Validity excludes view timestamps, scrolling, and cache writes. Executed
        no-op/view/locale regressions preserve models. Rendering uses current
        localization and measured geometry rather than persisted pixels, with
        geometry synchronized on rendering, restoration, and resize.
      truncated: false
  - id: A6
    source: brief.md
    text: "A6: When only Chr1's dependencies change, Chr1 is reconstructed while
      unrelated Chr2 models/cards are reused; shared-source and project-wide
      dependency changes invalidate every affected chromosome, with a safe
      full-project fallback when impact cannot be established."
    result: passed
    reason:
      text: Executed Chr1-only regression rebuilds Chr1 while retaining Chr2 model
        identity. Source dependencies, retained assembly IDs, phased parents,
        and old/new assignment scopes cover shared impact; unknown/global impact
        falls back to full rebuilding. DOM reconciliation retains nodes
        associated with unchanged models.
      truncated: false
  - id: A7
    source: brief.md
    text: "A7: Current in-memory unsaved Final Path edits, including explicit empty
      paths, take priority over saved/persistent state; a session-only edit is
      never stored as a restart-reusable saved-project snapshot."
    result: passed
    reason:
      text: Saved cards are constructed and persisted before current-session overlays.
        Passing regressions confirm unsaved edits and explicit empty paths
        override memory display without changing the persistent saved snapshot.
      truncated: false
  - id: A8
    source: brief.md
    text: "A8: Switching or closing projects, concurrent refresh/entry, and edits
      during an in-flight load cannot install or persist a result for the wrong
      project, route, request generation, or content revision; equal project IDs
      in different workspaces do not collide."
    result: passed
    reason:
      text: Workspace/project keys, request tokens, route checks, mutation stamps,
        revision rechecks, and transactional publication guards prevent obsolete
        installation. Executed regressions cover duplicate loads, project/route
        closure, replacement hosts, newer refreshes, edits during reads, and
        superseded publication.
      truncated: false
  - id: A9
    source: brief.md
    text: "A9: Missing, corrupt, incompatible, or stale cache data falls back safely
      to rebuilding; cache read/write failures alone do not prevent an otherwise
      successful preview, and required-source failures retain an honest
      error/retry state."
    result: passed
    reason:
      text: Executed malformed/corrupt/version-incompatible snapshot and cache-I/O
        regressions safely rebuild. Optional cache failure does not break
        ordinary backend source reads; required-source failure produces an
        honest error and successful retry.
      truncated: false
  - id: A10
    source: brief.md
    text: "A10: The existing refresh icon forces fresh source reads and
      reconstruction, updates the cache after success, and preserves one set of
      delegated handlers/observers without accumulating listeners."
    result: passed
    reason:
      text: Forced refresh bypasses both cache layers and publishes fresh
        saved-content results. Runtime-executed refresh and repeated-binding
        regressions confirm one delegated click handler and one ResizeObserver;
        observer evidence uses stand-ins.
      truncated: false
  - id: A11
    source: brief.md
    text: "A11: Persistent snapshots are compact, schema/model-versioned structured
      data with true genomic lengths and source identities, not HTML,
      width-dependent coordinates, or raw source records/sequences; deleting a
      snapshot is harmless, and relocating a complete workspace does not make
      cached project data depend on its old absolute path."
    result: passed
    reason:
      text: Inspected payload construction stores versioned semantic cards, biological
        lengths, and source dependencies, stripping raw ctg collections and
        deriving HTML/pixels during rendering. Backend regressions confirm
        harmless snapshot deletion and valid snapshots after database
        relocation.
      truncated: false
  - id: A12
    source: brief.md
    text: "A12: Cache-hit and cold-built views preserve one card per chromosome,
      hidden unpositioned information, dataset colors, uniform source-band
      height, gap labels, minimum visible path widths, source/path alignment,
      whole-name hiding when too narrow, whole-card provenance hover, and
      chromosome-to-Assembly navigation with edits preserved."
    result: passed
    reason:
      text: Inspected rendering, shared layout code, and executed
        rendering/style/model regressions support chromosome cards, hidden
        unpositioned details, dataset colors, uniform bands, gaps, minimum
        widths, alignment, whole-name hiding, card-hover provenance, and
        edit-preserving navigation. Cache restoration uses the same
        renderer/layout path. This is code and automated evidence, not native
        visual acceptance.
      truncated: false
  - id: A13
    source: brief.md
    text: "A13: Cache operations write only derived cache/validity metadata and
      cannot overwrite assembly view state, Final Path edits, source-contig
      data, or exported biological coordinates."
    result: passed
    reason:
      text: Cache publication writes only project_preview derived tables, with
        additive schema installation. Inspected cache code does not overwrite
        authoritative assembly/view/path/source records; preservation and
        biological-coordinate regressions support this separation.
      truncated: false
  - id: A14
    source: brief.md
    text: "A14: Targeted regression cases and measurement hooks/evidence are
      prepared, but unexecuted checks remain pending; no tests, builds, browser
      checks, CI-triggering push, successful verification claim, or archive
      completion occurs until the user lifts the existing restriction."
    result: passed
    reason:
      text: The original deferral is conditional, and the user explicitly confirmed it
        was lifted before unified checks/push. Builder documentation records
        that chronology and distinguishes pending formal acceptance from
        executed checks. Runtime receipts establish actual execution after
        authorization; no native visual or millisecond claim is made, and this
        verifier performed no archive or state transition.
      truncated: false
