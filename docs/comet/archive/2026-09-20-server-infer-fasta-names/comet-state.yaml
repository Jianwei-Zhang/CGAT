  - id: A1
    source: specs/server-fasta-arguments/spec.md
    text: Infer reference and repeated dataset names during preparation Given quoted
      readable FASTA paths whose basenames include supported suffixes and
      spaces, when the user runs `prepare.sh` with one-value `--ref` and
      repeated one-value `--ds` arguments, then the generated reference and
      dataset metadata use the deterministic inferred names and preserve dataset
      order.
    result: passed
    reason:
      text: One-value --ref and repeated --ds use the shared deterministic inference
        rule; real gzip, spaces, uppercase suffixes, metadata, packaged
        filenames, and order are covered.
      truncated: false
  - id: A2
    source: specs/server-fasta-arguments/spec.md
    text: Preserve explicitly named preparation arguments Given valid explicit names
      and readable FASTA paths, when the user uses the existing `--ref <name>
      <fasta>` and `--ds <name> <fasta>` forms, then preparation records the
      explicit names exactly as before.
    result: passed
    reason:
      text: Explicit --ref <name> <fasta> and --ds <name> <fasta> branches remain and
        continue through existing validation and passing regressions.
      truncated: false
  - id: A3
    source: specs/server-fasta-arguments/spec.md
    text: Mix explicit and inferred dataset names Given multiple readable dataset
      FASTAs, when explicit and one-value `--ds` forms are mixed, then each
      dataset receives the requested or inferred name and the first dataset
      remains primary.
    result: passed
    reason:
      text: Mixed inferred and explicit datasets are recorded in input order, and the
        first dataset remains primary.
      truncated: false
  - id: A4
    source: specs/server-fasta-arguments/spec.md
    text: Reject duplicate inferred dataset names Given two dataset paths that infer
      the same name, when preparation parses both, then it fails with the
      existing duplicate dataset name error before producing a valid workspace.
    result: passed
    reason:
      text: Two paths inferring the same name trigger the existing duplicate-name
        error without creating a valid workspace.
      truncated: false
  - id: A5
    source: specs/server-fasta-arguments/spec.md
    text: Infer a name for an incremental dataset Given a completed generated Server
      workspace and a readable dataset FASTA, when the user runs `add_dataset.sh
      --ds <fasta>`, then the dataset name is inferred by the same rule, Server
      metadata is updated, and the add package uses that name.
    result: passed
    reason:
      text: Generated add_dataset.sh uses the shared helper; concise --ds updates
        metadata and produces the correctly named add package.
      truncated: false
  - id: A6
    source: specs/server-fasta-arguments/spec.md
    text: Advertise both concise and explicit forms Given a user reads command help
      or the English or Chinese Server instructions, then both accepted forms
      and the inference rule are described without hiding the
      backward-compatible explicit form.
    result: passed
    reason:
      text: Prepare and generated add-dataset help plus top-level and Server-specific
        bilingual READMEs show both forms and the complete inference rule.
      truncated: false
