acceptance:
  - id: A1
    source: brief.md
    text: "A1: A chromosome-partitioned dataset track with zero or one contig
      schedules no `*_vs_self` alignment task and produces no required pairwise
      run for that track."
    result: passed
    reason:
      text: Server skips self-run creation and scheduling for tracks with fewer than
        two contigs and cleans stale task directories.
      truncated: false
  - id: A2
    source: brief.md
    text: "A2: A chromosome-partitioned dataset track with two or more contigs
      produces alignments for every required different-contig unordered pair
      exactly once, with no same-contig pair and no duplicate reverse-direction
      pair."
    result: passed
    reason:
      text: Deterministic aliases with minimap2 -X retain each distinct-contig
        unordered pair once, with no same-contig or reverse duplicate pair.
      truncated: false
  - id: A3
    source: brief.md
    text: "A3: The final Server PAF uses original contig names and preserves
      downstream coordinates, strand, MAPQ, alignment metrics, CIGAR semantics,
      hashes, checkpoints, reports, Full delivery, and Light delivery
      contracts."
    result: passed
    reason:
      text: Canonical-name restoration changes only PAF names, preserves alignment
        semantics, publishes atomically, fingerprints helper inputs, and
        preserves Full/Light contracts.
      truncated: false
  - id: A4
    source: brief.md
    text: "A4: Desktop import persists the same usable cross-contig pairwise
      evidence as the canonical Server PAF and existing pairwise queries return
      equivalent results after the optimized load."
    result: passed
    reason:
      text: Optimized import preserves canonical usable cross-contig evidence and
        equivalent normal/swapped query results, including the large-package
        comparison.
      truncated: false
  - id: A5
    source: brief.md
    text: "A5: Initial pairwise import uses bounded batches and a single SQLite
      writer, avoids maintaining the two pairwise-hit lookup indexes per
      inserted row, creates those indexes after loading, and retains
      cancellation and rollback safety."
    result: passed
    reason:
      text: Bounded parsers feed one SQLite writer; deferred indexes share one
        transaction with loading, and parser/write/pre-index/post-index
        cancellation rolls back data and indexes.
      truncated: false
  - id: A6
    source: brief.md
    text: "A6: The Settings panel offers persisted `Auto`, `1`, `2`, `4`, and `8`
      import-parallelism choices, defaults to `Auto`, and applies the selected
      value to parser workers without creating concurrent SQLite writers."
    result: passed
    reason:
      text: Auto/1/2/4/8 persists and passes through archive and extracted imports to
        bounded parser workers while SQLite remains one writer.
      truncated: false
  - id: A7
    source: brief.md
    text: "A7: Import progress reports the active PAF, bytes processed, rows parsed,
      hits written, per-file progress, and overall pairwise progress often
      enough that a large file does not appear stalled."
    result: passed
    reason:
      text: Structured transient progress reports active PAF, bytes, rows, hits, file
        position, and overall progress without durable-row or log flooding.
      truncated: false
  - id: A8
    source: brief.md
    text: "A8: On the same Windows host and clean destination, the optimized
      candidate reduces the pairwise-index phase wall time for
      `zyr-test9.light.tar.gz` by at least 30 percent versus the recorded
      baseline, with matching usable hit results and no required verification
      regression."
    result: passed
    reason:
      text: Same-host clean-destination Runtime evidence improved the pairwise phase
        from 250466 ms to 100079 ms (60.043%) with matching usable results and
        healthy databases.
      truncated: false
  - id: A9
    source: specs/import-performance-controls/spec.md
    text: Persist an explicit import parallelism Given the user selects `4`, when
      the application restarts and starts a supported initial import, then the
      Settings panel still shows `4` and the backend uses four parser workers
      with one SQLite writer.
    result: passed
    reason:
      text: Persisted value 4 survives settings reload and is propagated to four
        parser workers, subject only to reducing unused workers when files are
        fewer; writer count stays one.
      truncated: false
  - id: A10
    source: specs/import-performance-controls/spec.md
    text: Use Auto safely Given the setting is absent, invalid, or set to `Auto`,
      when an import starts, then the application resolves a bounded
      host-appropriate parser count and does not create concurrent SQLite
      writers.
    result: passed
    reason:
      text: Missing, invalid, or Auto values resolve to a host-appropriate bounded
        count of 1 through 8 without concurrent SQLite writers.
      truncated: false
  - id: A11
    source: specs/import-performance-controls/spec.md
    text: Show live progress without log flooding Given a large PAF is being
      indexed, when structured progress events arrive, then the current progress
      presentation updates bytes, rows, hits, file percentage, and overall
      percentage without adding one permanent stage row per tick.
    result: passed
    reason:
      text: Transient updates replace one live pairwise row and display bytes, parsed
        rows, hits, file percentage, and overall percentage without permanent
        tick rows.
      truncated: false
  - id: A12
    source: specs/import-performance-controls/spec.md
    text: Preserve Windows frontend validation Given the settings and progress UI
      changes are complete, when frontend tests and the production build run
      with Windows Node/npm.cmd, then they pass and no generated `dist/` remains
      tracked or untracked afterward.
    result: passed
    reason:
      text: Windows npm.cmd frontend validation passed 1142 tests and production
        build, and generated dist was removed and remains absent.
      truncated: false
  - id: A13
    source: specs/pairwise-import-engine/spec.md
    text: Bulk-load pairwise hits safely Given multiple large pairwise PAF files,
      when initial import loads them, then bounded parser workers feed one
      writer, hit indexes are created after data loading, and the completed
      database passes integrity and query checks.
    result: passed
    reason:
      text: Large multi-file loads use bounded workers and one transactional writer,
        rebuild required indexes after loading, pass quick_check, and retain
        working queries.
      truncated: false
  - id: A14
    source: specs/pairwise-import-engine/spec.md
    text: Preserve pairwise query results Given a canonical package and the same
      query filters, when results are queried from baseline and optimized
      imports, then both normal and swapped-direction pairwise evidence are
      equivalent.
    result: passed
    reason:
      text: Coordinate, strand, identity, MAPQ, CIGAR, and normal/swapped query
        semantics are covered by unit and representative large-package
        equivalence checks.
      truncated: false
  - id: A15
    source: specs/pairwise-import-engine/spec.md
    text: Cancel during a large PAF Given an import is cancelled while parser
      workers are active, when cancellation propagates, then workers and the
      writer stop, no partial workspace is accepted, and the existing rollback
      contract is preserved.
    result: passed
    reason:
      text: Cancellation during parser work or before/after index creation stops work
        and rolls back runs, hits, and index changes; dedicated regressions
        pass.
      truncated: false
  - id: A16
    source: specs/pairwise-import-engine/spec.md
    text: Report granular progress Given a PAF requires long processing, when import
      is active, then progress updates advance within that file and report
      bytes, rows, hits, file position, and overall pairwise position without
      waiting for the next file.
    result: passed
    reason:
      text: Worker batches and byte thresholds emit throttled within-file
        bytes/rows/hits and file/overall position during long PAF processing.
      truncated: false
  - id: A17
    source: specs/pairwise-import-engine/spec.md
    text: Meet the large-package performance target Given baseline and candidate
      imports of `zyr-test9.light.tar.gz` on the same Windows host and clean
      destinations, when the pairwise-index phase is measured, then the
      candidate is at least 30 percent faster and produces equivalent usable hit
      results.
    result: passed
    reason:
      text: Formal large-package evidence exceeds the 30% target with 60.043%
        improvement and matching runs, hits, summaries, and representative
        bidirectional queries.
      truncated: false
  - id: A18
    source: specs/server-pairwise-generation/spec.md
    text: Skip a track partition with one contig Given a chromosome partition in
      which a dataset track contains one selected contig, when Server prepares
      alignment tasks, then it does not schedule that track's `*_vs_self` task
      and the absence is treated as a valid no-pair condition.
    result: passed
    reason:
      text: A one-contig chromosome track creates no self-run directory, command, or
        manifest task and is treated as a valid no-pair condition.
      truncated: false
  - id: A19
    source: specs/server-pairwise-generation/spec.md
    text: Preserve auxiliary-track internal relationships Given an auxiliary dataset
      track with multiple contigs in one chromosome partition, when Server runs
      its self alignment, then every required relationship between different
      contigs is present exactly once and no same-contig or reverse-duplicate
      pair is published.
    result: passed
    reason:
      text: The same per-track logic preserves every required internal auxiliary-track
        distinct-contig unordered relationship exactly once.
      truncated: false
  - id: A20
    source: specs/server-pairwise-generation/spec.md
    text: Publish canonical names and evidence Given Server uses temporary alignment
      identifiers internally, when the self-run completes, then the final PAF
      and every downstream hash, checkpoint, report, evidence reference, Full
      package, and Light package use the restored original contig names and
      canonical artifact.
    result: passed
    reason:
      text: Temporary identifiers are restored before canonical publication;
        checkpoints, evidence, and Full/Light packages consume canonical
        result.paf and exclude alias helpers.
      truncated: false
  - id: A21
    source: specs/server-pairwise-generation/spec.md
    text: Preserve cross-contig alignment semantics Given the legacy self-run output
      and the optimized output for the same multi-contig fixture, when legacy
      same-contig and reverse-duplicate rows are normalized away, then the
      remaining cross-contig records are equivalent in names, coordinates,
      strand, MAPQ, alignment metrics, and CIGAR semantics.
    result: passed
    reason:
      text: Real minimap2 evidence shows normalized legacy and optimized cross-contig
        records equivalent in names, coordinates, strand, MAPQ, metrics, and
        CIGAR.
      truncated: false
