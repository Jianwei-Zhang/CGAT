acceptance:
  - id: A1
    source: brief.md
    text: "A1: Main and local views remove the visible legacy 最小刻度单位(kb) and 最多可展示数
      fields. Each view renders one navigator below its own toolbar and above
      its graphic; the overview remains outside the horizontally scrolling
      content and its axis aligns with the plot area rather than the track-name
      gutter."
    result: passed
    reason:
      text: Legacy scale fields are removed; one external navigator per main/local
        view is correctly placed and aligned.
      truncated: false
  - id: A2
    source: brief.md
    text: "A2: Dragging the overview selection translates the actual visible genomic
      interval without changing its span, stays within the complete view domain,
      and updates the graphic. Scrolling the graphic updates that same overview
      selection and span display; neither direction creates a feedback loop."
    result: passed
    reason:
      text: Overview range drag preserves span, clamps to the domain, synchronizes
        plot scroll, and avoids feedback loops.
      truncated: false
  - id: A3
    source: brief.md
    text: "A3: Dragging either selection edge changes the visible span with the
      opposite edge stationary, within the valid domain and supported rendering
      limits. The overview, read-only Window display, ruler, and graphic remain
      synchronized; completing or cancelling a drag does not edit contigs."
    result: passed
    reason:
      text: Edge resize preserves the opposite endpoint, respects bounds, synchronizes
        all representations, and does not edit contigs.
      truncated: false
  - id: A4
    source: brief.md
    text: "A4: Main/local wheel zoom decreases/increases span within bounds; the
      navigator has no minus/plus zoom buttons. Full range (全览) selects the
      entire current domain and displays all current content, without changing
      font size or track height. Its tooltip explains that it displays the
      complete viewing range, not application fullscreen."
    result: passed
    reason:
      text: Bounded main/local wheel zoom and Full range behavior pass with no
        plus/minus controls and correct tooltip semantics.
      truncated: false
  - id: A5
    source: brief.md
    text: "A5: The navigator shows a read-only Window (窗口) span value with automatic
      kb/Mb formatting. It contains no editable span input or unit selector.
      Wheel zoom, edge resize, panning, horizontal scrolling, Full range,
      content changes and refreshes keep this display synchronized with the
      actual visible span."
    result: passed
    reason:
      text: Window is read-only and geometry-derived; empty primary content now shows
        — with disabled, aria-disabled, inert navigation while populated views
        retain kb/Mb synchronization.
      truncated: false
  - id: A6
    source: brief.md
    text: "A6: Main/local ruler spacing is controlled directly in the existing
      toolbar, not inside Display settings. A single editable interval control
      offers Auto as its first/default option, the shared kb presets (250, 500,
      750, 1000, 10000, 100000), and custom positive values. Enter or blur
      commits; invalid input gives explicit feedback without changing ruler or
      window state. Changing ticks leaves visible interval, contig geometry,
      scroll position, filters and the other view unchanged; Auto stays legible
      at actual plot/font width."
    result: passed
    reason:
      text: Inline Auto/numeric ruler controls, all presets, validation, keyboard
        operation, and interval independence pass.
      truncated: false
  - id: A7
    source: brief.md
    text: "A7: Main and local navigation state remain independent after entry.
      Ordinary, track-pair, and composition local modes all navigate their own
      complete rendered domain rather than automatically using the entire
      reference chromosome; changes of chromosome/content safely clamp or
      restore an applicable interval."
    result: passed
    reason:
      text: Main/local state isolation and ordinary, track-pair, and composition
        domain navigation pass, including responsive composition interval
        preservation.
      truncated: false
  - id: A8
    source: brief.md
    text: "A8: Legacy saved preferences are accepted without losing assembly data or
      unrelated settings. Existing scale preferences are interpreted for
      main/local viewing-range compatibility where applicable; no obsolete
      tick-count preference can secretly change a migrated view when the new
      ruler interval changes. Existing persisted/session ownership boundaries
      are retained unless necessary for the navigator."
    result: passed
    reason:
      text: Legacy scale migration initializes visible span while ruler settings
        remain independent and persistence ownership is preserved.
      truncated: false
  - id: A9
    source: brief.md
    text: "A9: Navigation, tick changes, responsive layout changes, and view
      restoration do not create assembly edit-history entries or alter contig
      positions, orientations, local anchors, alignment evidence, Final Path
      order, or exported sequence/data. Existing selection, contig dragging,
      focus and history actions continue to work in mouse mode; hand-mode drag
      exclusively pans the viewing interval."
    result: passed
    reason:
      text: Navigation changes only view state and preserves biological records,
        offsets, anchors, evidence, selections, histories, and Final Path state.
      truncated: false
  - id: A10
    source: brief.md
    text: "A10: Final Path removes both legacy inputs from the App header and
      displays only its ruler interval control. It has no new overview range
      navigator, visible-span input, fit-all button, or zoom buttons. Main/local
      navigation does not modify its interval preference."
    result: passed
    reason:
      text: Final Path remains navigator-free and exposes only its independent direct
        ruler interval control.
      truncated: false
  - id: A11
    source: brief.md
    text: "A11: Final Path exposes one ruler interval control, defaulting to Auto
      with manual spacing available. Manual ruler changes affect only
      ticks/labels, not path pixel geometry, segment order, segment lengths, or
      export coordinates. Empty and very short paths remain well defined."
    result: passed
    reason:
      text: Final Path Auto/manual ruler changes leave segment geometry and state
        unchanged, including defined empty/short behavior.
      truncated: false
  - id: A12
    source: brief.md
    text: "A12: Final Path displays its complete assembled path fitted to the
      available plot width on render and window resize, without needing
      horizontal navigation to reach the last segment. Legacy scale/tick-count
      preferences cannot override that fit; automatic tick density follows the
      width while a manually chosen interval remains a ruler-only preference."
    result: passed
    reason:
      text: Final Path fits the measured viewport across responsive widths and ignores
        legacy scale fields for geometry.
      truncated: false
  - id: A13
    source: brief.md
    text: "A13: New main/local controls and the direct Final Path interval control
      have Chinese/English labels and accessible names. Tick entry and selection
      remain keyboard-operable; window display is not editable or focusable.
      Overview handles remain usable when the selected interval is wide enough;
      below 48px on the overview axis hide resize handles and prioritize pan
      through a transparent target of at least 24px, clamped inside the axis.
      Keep the visible selection proportional to the real interval; wheel zoom
      remains available and handles return at 48px or wider. Wide/narrow layouts
      group left/right movement icons before the overview axis and keep Full
      range directly on its right without covering the graphic."
    result: passed
    reason:
      text: Localization, accessibility, keyboard operation, responsive grouping,
        compact pan target, and focus fallbacks pass.
      truncated: false
  - id: A14
    source: brief.md
    text: "A14: Current Windows-host frontend regression tests and a Windows-host
      production build pass, with generated dist removed after inspection.
      Interaction/visual evidence covers main view, all local modes, and Final
      Path, including reciprocal scroll/range updates, boundaries, empty data,
      and manual ticks; unexecuted native or platform checks are reported as
      unverified, not passed."
    result: passed
    reason:
      text: Current Runtime receipts pass 1227/1227 Windows tests, production build
        with dist removed, 43+34+34 populated and 6 empty browser checks, no
        page errors, and Git diff check.
      truncated: false
  - id: A15
    source: brief.md
    text: "A15: Ordinary wheel over the main/local overview axis or plot zooms
      without Ctrl/Space in either interaction mode. Wheel-up zooms in and
      wheel-down zooms out, anchored at the cursor's genomic point on the plot
      or the current range center on the overview. Range, span, graphic and
      ruler stay synchronized; invalid/empty domains, limits and high-frequency
      events remain bounded. Wheel over form fields, menus or outside these
      surfaces is not captured as chart zoom, and Final Path gains no new wheel
      zoom."
    result: passed
    reason:
      text: Modifier-free wheel handling has correct surfaces, anchoring, coalescing,
        isolation, bounds, empty-domain inertness, and Final Path exclusion.
      truncated: false
  - id: A16
    source: brief.md
    text: "A16: Each main/local navigation row has one clear sliding mouse/hand mode
      switch component (off = mouse, on = hand), not separate independent mode
      buttons, defaulting to mouse for a new context and independent of the
      other view. Mouse mode preserves existing selection/contig-drag/blank-area
      box-selection behavior; hand mode makes ordinary plot left-drag pan the
      interval without changing its span, moving contigs, committing a box
      selection or triggering a post-drag click. Cursor/active state reflect the
      mode; pointer cancellation, mode change, blur and repeated rerenders do
      not leave dragging stuck or duplicate handlers."
    result: passed
    reason:
      text: The mutual-exclusive mouse/hand switch, ownership, span-preserving pan,
        click suppression, cancellation, cleanup, and rerender behavior pass.
      truncated: false
  - id: A17
    source: brief.md
    text: "A17: Left/right icons form an adjacent movement group before each
      overview axis; Full range is immediately after the axis. Each moves the
      visible interval by half its current genomic span toward lower/higher
      coordinates, preserving span and synchronizing plot/range/display. Near
      edges move only the remaining distance and disable blocked directions;
      disable both on Full range. They are navigation controls, not history
      controls, and are absent from Final Path."
    result: passed
    reason:
      text: Half-window controls are correctly placed, named, bounded, disable at
        edges/full range, preserve span, and are absent from Final Path.
      truncated: false
