acceptance:
  - id: A1
    source: brief.md
    text: "A1: Dropping a valid delivery archive (.zip or .tar.gz, retaining
      existing .tgz compatibility) enters the existing compressed-archive import
      flow with the selected destination policy, retains progress/cancellation,
      and opens the successfully imported workspace."
    result: passed
    reason:
      text: 原生监听使用 Tauri onDragDropEvent 的文件系统路径，控制器将 .zip/.tar.gz/.tgz 路由到既有可编辑确认和
        runImportZipFlow；保留进度、取消和成功后的会话进入。当前 Windows 前端格式路由测试、后端 ZIP/tar.gz/tgz
        导入与取消回归、Tauri 回归均通过；真实 Windows 边界采用用户在完整当前范围后的总体手工验收声明，不宣称代理逐格式实测。
      truncated: false
  - id: A2
    source: brief.md
    text: "A2: Dropping a fresh extracted delivery root or a supported one-level
      wrapper resolves the bundle and uses the existing in-place import flow,
      without requiring the user to recreate a ZIP."
    result: passed
    reason:
      text: project_entry.rs 只读解析交付根或唯一一层 wrapper，歧义目录拒绝；新解压包由既有
        runImportExtractedFlow 原地导入并成功后打开，不要求重打 ZIP。根/wrapper
        分类、分流和既有导入回归通过；Windows 原生层证据为用户总体验收确认。
      truncated: false
  - id: A3
    source: brief.md
    text: "A3: Dropping an existing workspace opens its existing projects and edits
      without running delivery import or creating a new database project."
    result: passed
    reason:
      text: 分类优先识别根或 wrapper 下的既有 project.sqlite，无效数据库不回退导入；原生 drop 调用
        runOpenWorkspaceFlow(..., false)，openProjectWorkspace 在已有项目或
        createIfMissing=false 时不新建项目。数据库保持、仅打开不导入、失败会话保护测试通过；现有编辑保留的 Windows
        原生验收由用户总体声明提供。
      truncated: false
  - id: A4
    source: brief.md
    text: "A4: Reopening a workspace already recorded on the project page leaves
      exactly one record for that filesystem workspace, preserving its existing
      user metadata and arrival order. Equivalent path spellings and supported
      canonical aliases do not add records."
    result: passed
    reason:
      text: 两条历史写入路径复用 workspace-history.js；后端
        canonical_workspace_path/workspace_aliases
        解析实际文件系统身份，reconcileWorkspaceHistory 合并别名且保留首条记录元数据与顺序。Windows
        大小写别名、分隔符、legacy 重复卡片、元数据和到达顺序回归通过，独立 Linux 身份测试亦通过；结合用户总体 Windows
        验收，无新增重复记录问题证据。
      truncated: false
  - id: A5
    source: brief.md
    text: "A5: Dropping the currently open workspace is harmless and does not
      duplicate records or recreate the active project. A separate workspace
      copy remains an independent record."
    result: passed
    reason:
      text: 控制器对当前 canonical workspace
        直接返回已打开提示，不执行切换或导入；去重依据实际目录身份而非名称或包内容，独立副本不合并。active-workspace
        no-op、不同副本和并发重复事件测试通过；Windows 原生总体手工验收由用户确认，不虚构逐副本观察。
      truncated: false
  - id: A6
    source: brief.md
    text: "A6: Invalid inputs, ambiguous wrapper directories, unusable existing
      databases, unsupported multi-item drops, and drops during conflicting work
      produce actionable feedback without starting imports or adding history
      records."
    result: passed
    reason:
      text: 分类先于修改；坏归档/无效路径/不可用数据库/多候选 wrapper 拒绝，多项 drop、冲突操作和解析中重复事件被守卫阻断并提供反馈。前端
        busy/multi-item/race/error 和后端只读错误夹具均通过；用户当前总体 Windows 原生验收补充真实桌面边界，不将
        mock 当作原生测试。
      truncated: false
  - id: A7
    source: brief.md
    text: "A7: Switching through drag-and-drop retains the existing assembly-state
      flush/session handling, and cancel/error paths do not present the
      operation as a successful import."
    result: passed
    reason:
      text: 原生入口及既有导入/打开流程复用 flushAssemblyProjectState
        与现有会话切换；失败保存/打开保留旧会话，取消/失败不写成功历史，确认取消未启动导入。当前失败/保存/会话回归、后端取消清理、Tauri
        取消登记及浏览器确认取消场景通过；Windows 手工边界为用户总体验收声明。
      truncated: false
  - id: A8
    source: brief.md
    text: "A8: The existing button-based compressed archive import, extracted
      import, workspace open, and project-page entry flows remain available and
      share the same identity/deduplication rules."
    result: passed
    reason:
      text: 既有压缩导入、解压导入、打开按钮和真实项目页 record click 仍绑定；41d5cc6 将项目页入口/选中比较改为共享结构身份，并将
        copy/delete 安全比较隔离。当前 Runtime 前端日志中六个真实 bound-click 回归全部通过；共享身份/历史测试和
        Windows 生产构建通过。HEAD 995d498 的 GPM2.0 代码与 41d5cc6 无差异；结合用户总体 Windows 验收，原
        A8 缺陷已解决。
      truncated: false
  - id: A9
    source: brief.md
    text: "A9: The archive confirmation pre-fills an editable destination beside the
      archive using its complete stem plus a local timestamp formatted
      YYYYMMDD_HHMMSS. A compound .tar.gz suffix is entirely removed,
      intervening stem suffixes such as .no_fasta are preserved, generated-name
      collisions receive a visible numeric disambiguator before confirmation,
      and an existing destination or a creation-time race is rejected without
      overwriting it. Cancelling the confirmation creates no workspace or
      project history."
    result: passed
    reason:
      text: 本地时间一次生成 YYYYMMDD_HHMMSS 并存入确认状态；后端移除完整 .tar.gz/.zip/.tgz 后缀、保留
        .no_fasta、检查已占用条目并显示 _01 等后缀。目标可编辑，requireNewWorkspace 贯穿前端/Tauri 到原子
        fs::create_dir，已有目标或创建竞争失败不覆盖；确认取消不调用导入。时间/后缀/碰撞只读测试、原子不覆盖回归、1280/390/320px
        确认及取消 mock 通过；Windows 原生证据为用户总体验收而非逐案例代理观察。
      truncated: false
