acceptance:
  - id: A1
    source: brief.md
    text: "A1: Dropping a valid delivery archive (.zip or .tar.gz, retaining
      existing .tgz compatibility) enters the existing compressed-archive import
      flow with the selected destination policy, retains progress/cancellation,
      and opens the successfully imported workspace."
    result: blocked
    reason:
      text: 已核对三种后缀的控制器路由、现有压缩导入的进度/取消/完成路径及 Runtime 回归通过结果；但没有 Windows 和 macOS
        真实文件管理器拖入 .zip/.tar.gz/.tgz 后完成导入、显示进度、取消和打开工作区的可追溯记录。browser 六场景没有执行实际
        archive import，Windows 用户反馈不能替代此矩阵。阻断依据为 brief.md:65 和
        specs/drag-drop-project-entry/spec.md:43。
      truncated: false
  - id: A2
    source: brief.md
    text: "A2: Dropping a fresh extracted delivery root or a supported one-level
      wrapper resolves the bundle and uses the existing in-place import flow,
      without requiring the user to recreate a ZIP."
    result: blocked
    reason:
      text: backend/src/project_entry.rs 的根目录/唯一一层 wrapper 分类及 importer/initial.rs
        的原位导入路径得到实现和回归支持；但缺少 Windows Explorer、macOS Finder 拖入真实 fresh delivery
        root 和一层 wrapper 后完成原位导入、打开工作区的证据。现有 browser 场景未覆盖 extracted import。
      truncated: false
  - id: A3
    source: brief.md
    text: "A3: Dropping an existing workspace opens its existing projects and edits
      without running delivery import or creating a new database project."
    result: blocked
    reason:
      text: 已有数据库优先、只读分类、直接 open 及 createIfMissing=false
        路径均已核对，回归覆盖不重新初始化项目；但正式要求的真实原生拖放尚未证明既有工作区中的项目和编辑保持不变。需要携带已知编辑的真实
        workspace 的拖放前后比较，而不是仅有 mock 返回的 existingProjects。
      truncated: false
  - id: A4
    source: brief.md
    text: "A4: Reopening a workspace already recorded on the project page leaves
      exactly one record for that filesystem workspace, preserving its existing
      user metadata and arrival order. Equivalent path spellings and supported
      canonical aliases do not add records."
    result: passed
    reason:
      text: 共享 workspace-history.js 保留首条记录的位置和用户元数据；Tauri open_workspace 返回文件系统
        canonical aliases，并在两条 history 写入路径使用前统一 reconcile。Windows 后端别名测试、独立
        Linux 大小写/符号链接测试、共享 history 回归及 browser 重复打开的一条记录和 note 保留断言均通过。此通过不代表
        macOS 原生拖放已验证。
      truncated: false
  - id: A5
    source: brief.md
    text: "A5: Dropping the currently open workspace is harmless and does not
      duplicate records or recreate the active project. A separate workspace
      copy remains an independent record."
    result: blocked
    reason:
      text: 控制器的 active canonical workspace no-op、重复事件锁以及 distinct workspace copies
        的身份隔离得到源码和测试支持，browser 也验证了 mock active workspace 不再次 open；但缺少真实
        Windows/macOS 当前工作区重复拖入和独立副本拖入的项目数、历史数与会话保持记录，不能完成正式原生验收。
      truncated: false
  - id: A6
    source: brief.md
    text: "A6: Invalid inputs, ambiguous wrapper directories, unusable existing
      databases, unsupported multi-item drops, and drops during conflicting work
      produce actionable feedback without starting imports or adding history
      records."
    result: blocked
    reason:
      text: 已核对无效数据库不回退导入、歧义 wrapper 拒绝、多项输入拒绝、冲突操作及重复事件守卫，相关自动回归通过；但没有真实 native drop
        下无效输入、多项拖放、坏数据库和运行中冲突的反馈与不产生文件/历史记录证据。brief.md:65 明确要求原生 busy feedback
        检查。
      truncated: false
  - id: A7
    source: brief.md
    text: "A7: Switching through drag-and-drop retains the existing assembly-state
      flush/session handling, and cancel/error paths do not present the
      operation as a successful import."
    result: blocked
    reason:
      text: 拖放入口和既有 import/open flow 调用 assembly-state
        flush，失败路径及取消回归已检查；但未提供真实原生切换前存在未保存 assembly
        编辑、切换后重新打开验证编辑保留，以及实际进行中取消/错误不产生成功项目的记录。确认框取消 mock 不能覆盖导入进行中取消和真实会话持久化。
      truncated: false
  - id: A8
    source: brief.md
    text: "A8: The existing button-based compressed archive import, extracted
      import, workspace open, and project-page entry flows remain available and
      share the same identity/deduplication rules."
    result: passed
    reason:
      text: 既有压缩导入、解压目录导入和 workspace-open 按钮仍绑定原 flow；项目页 click/selection 使用共享结构身份并交由
        native 解析 canonical aliases。已独立核对 importer-page.js:342-351,2212-2223
        和共享写入路径；Runtime frontend 日志确认实际绑定 click handler 的六项 POSIX literal
        backslash、大小写、Windows separator/alias 和同路径回归通过。未使用先前 reviewer 的通过结论代替判断。
      truncated: false
  - id: A9
    source: brief.md
    text: "A9: The archive confirmation pre-fills an editable destination beside the
      archive using its complete stem plus a local timestamp formatted
      YYYYMMDD_HHMMSS. A compound .tar.gz suffix is entirely removed,
      intervening stem suffixes such as .no_fasta are preserved, generated-name
      collisions receive a visible numeric disambiguator before confirmation,
      and an existing destination or a creation-time race is rejected without
      overwriting it. Cancelling the confirmation creates no workspace or
      project history."
    result: passed
    reason:
      text: 已核对本地秒级时间戳、完整移除 .tar.gz/.zip/.tgz 且保留 .no_fasta、只读占用探测及可见 _01
        等消歧；建议值保存在确认状态中。browser 验证字段可编辑、重渲染保留和确认取消不调用 import/initialize；backend
        archive 回归验证已有目标及 creation-time race 被原子 create_dir 拒绝且原数据保留。相关 Runtime
        检查通过，此项通过仅覆盖目的地与确认策略，不补足 A1 的原生导入生命周期证据。
      truncated: false
