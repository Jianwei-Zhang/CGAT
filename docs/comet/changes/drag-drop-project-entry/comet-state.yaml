    text: "A2: Dropping a fresh extracted delivery root or a supported one-level
      wrapper resolves the bundle and uses the existing in-place import flow,
      without requiring the user to recreate a ZIP."
    result: pending
    reason: null
  - id: A3
    source: brief.md
    text: "A3: Dropping an existing workspace opens its existing projects and edits
      without running delivery import or creating a new database project."
    result: pending
    reason: null
  - id: A4
    source: brief.md
    text: "A4: Reopening a workspace already recorded on the project page leaves
      exactly one record for that filesystem workspace, preserving its existing
      user metadata and arrival order. Equivalent path spellings and supported
      canonical aliases do not add records."
    result: pending
    reason: null
  - id: A5
    source: brief.md
    text: "A5: Dropping the currently open workspace is harmless and does not
      duplicate records or recreate the active project. A separate workspace
      copy remains an independent record."
    result: pending
    reason: null
  - id: A6
    source: brief.md
    text: "A6: Invalid inputs, ambiguous wrapper directories, unusable existing
      databases, unsupported multi-item drops, and drops during conflicting work
      produce actionable feedback without starting imports or adding history
      records."
    result: pending
    reason: null
  - id: A7
    source: brief.md
    text: "A7: Switching through drag-and-drop retains the existing assembly-state
      flush/session handling, and cancel/error paths do not present the
      operation as a successful import."
    result: pending
    reason: null
  - id: A8
    source: brief.md
    text: "A8: The existing button-based compressed archive import, extracted
      import, workspace open, and project-page entry flows remain available and
      share the same identity/deduplication rules."
    result: pending
    reason: null
  - id: A9
    source: brief.md
    text: "A9: The archive confirmation pre-fills an editable destination beside the
      archive using its complete stem plus a local timestamp formatted
      YYYYMMDD_HHMMSS. A compound .tar.gz suffix is entirely removed,
      intervening stem suffixes such as .no_fasta are preserved, generated-name
      collisions receive a visible numeric disambiguator before confirmation,
      and an existing destination or a creation-time race is rejected without
      overwriting it. Cancelling the confirmation creates no workspace or
      project history."
    result: pending
