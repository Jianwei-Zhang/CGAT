acceptance:
  - id: A1
    source: brief.md
    text: "A1: Re-entering Preview for an unchanged project in the same session
      reuses a valid memory model without the four whole-project source reads,
      model reconstruction, or a redundant loading placeholder; valid card DOM
      is reused where applicable."
    result: pending
    reason: null
  - id: A2
    source: brief.md
    text: "A2: After reopening the app/project, a valid project-owned persistent
      snapshot is read with lightweight validity metadata and rendered without
      whole-project source fetching or model reconstruction."
    result: pending
    reason: null
  - id: A3
    source: brief.md
    text: "A3: A project with no usable cache follows the existing
      full-read/normalize/build path, presents the correct preview, and saves a
      reusable derived snapshot when persistence is available."
    result: pending
    reason: null
  - id: A4
    source: brief.md
    text: "A4: Relevant Final Path, gap, source-contig
      structure/orientation/assignment/name, dataset, reference, baseline, or
      phased-track changes (including undo/redo and supported import/copy paths)
      invalidate affected snapshots before they can be presented as current."
    result: pending
    reason: null
  - id: A5
    source: brief.md
    text: "A5: Navigation, scrolling, view zoom, hover, locale, font, and pure
      view-state saves do not invalidate semantic preview data; presentation
      changes still update the rendered result."
    result: pending
    reason: null
  - id: A6
    source: brief.md
    text: "A6: When only Chr1's dependencies change, Chr1 is reconstructed while
      unrelated Chr2 models/cards are reused; shared-source and project-wide
      dependency changes invalidate every affected chromosome, with a safe
      full-project fallback when impact cannot be established."
    result: pending
    reason: null
  - id: A7
    source: brief.md
    text: "A7: Current in-memory unsaved Final Path edits, including explicit empty
      paths, take priority over saved/persistent state; a session-only edit is
      never stored as a restart-reusable saved-project snapshot."
    result: pending
    reason: null
  - id: A8
    source: brief.md
    text: "A8: Switching or closing projects, concurrent refresh/entry, and edits
      during an in-flight load cannot install or persist a result for the wrong
      project, route, request generation, or content revision; equal project IDs
      in different workspaces do not collide."
    result: pending
    reason: null
  - id: A9
    source: brief.md
    text: "A9: Missing, corrupt, incompatible, or stale cache data falls back safely
      to rebuilding; cache read/write failures alone do not prevent an otherwise
      successful preview, and required-source failures retain an honest
      error/retry state."
    result: pending
    reason: null
  - id: A10
    source: brief.md
    text: "A10: The existing refresh icon forces fresh source reads and
      reconstruction, updates the cache after success, and preserves one set of
      delegated handlers/observers without accumulating listeners."
    result: pending
    reason: null
  - id: A11
    source: brief.md
    text: "A11: Persistent snapshots are compact, schema/model-versioned structured
      data with true genomic lengths and source identities, not HTML,
      width-dependent coordinates, or raw source records/sequences; deleting a
      snapshot is harmless, and relocating a complete workspace does not make
      cached project data depend on its old absolute path."
    result: pending
    reason: null
  - id: A12
    source: brief.md
    text: "A12: Cache-hit and cold-built views preserve one card per chromosome,
      hidden unpositioned information, dataset colors, uniform source-band
      height, gap labels, minimum visible path widths, source/path alignment,
      whole-name hiding when too narrow, whole-card provenance hover, and
      chromosome-to-Assembly navigation with edits preserved."
    result: pending
    reason: null
  - id: A13
    source: brief.md
    text: "A13: Cache operations write only derived cache/validity metadata and
      cannot overwrite assembly view state, Final Path edits, source-contig
      data, or exported biological coordinates."
    result: pending
    reason: null
  - id: A14
    source: brief.md
    text: "A14: Targeted regression cases and measurement hooks/evidence are
      prepared, but unexecuted checks remain pending; no tests, builds, browser
      checks, CI-triggering push, successful verification claim, or archive
      completion occurs until the user lifts the existing restriction."
    result: pending
    reason: null
