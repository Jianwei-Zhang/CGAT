name: GPM2.0 Release installers

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to update or create, for example v2.0.1."
        required: false
        type: string

env:
  GPM_UPDATER_PUBLIC_KEY: ${{ vars.GPM_UPDATER_PUBLIC_KEY }}

permissions:
  contents: write

concurrency:
  group: release-installers-${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  quality:
    name: Quality gate
    uses: ./.github/workflows/quality.yml
    with:
      full: true

  prepare-release:
    name: Prepare release
    needs: quality
    runs-on: ubuntu-latest
    outputs:
      tag_name: ${{ steps.release-vars.outputs.tag_name }}
      version: ${{ steps.release-vars.outputs.version }}
      build_timestamp: ${{ steps.release-vars.outputs.build_timestamp }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}

      - name: Require updater signing configuration
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$GPM_UPDATER_PUBLIC_KEY" || { echo "Missing GPM_UPDATER_PUBLIC_KEY repository variable" >&2; exit 1; }
          test -n "$TAURI_SIGNING_PRIVATE_KEY" || { echo "Missing TAURI_SIGNING_PRIVATE_KEY secret" >&2; exit 1; }

      - name: Resolve release version
        id: release-vars
        shell: bash
        run: |
          set -euo pipefail

          version="$(sed -n 's/.*"version": *"\([^"]*\)".*/\1/p' GPM2.0/app/src-tauri/tauri.conf.json | head -n 1)"
          tag=""
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            tag="${{ inputs.tag }}"
          else
            tag="${{ github.ref_name }}"
          fi

          if [[ -z "$tag" ]]; then
            tag="v${version}"
          fi

          if [[ -z "$version" ]]; then
            echo "Failed to resolve app version from GPM2.0/app/src-tauri/tauri.conf.json." >&2
            exit 1
          fi

          if [[ ! "$tag" =~ ^[A-Za-z0-9][A-Za-z0-9._-]*$ ]]; then
            echo "Release tag contains unsupported characters, got: ${tag}" >&2
            exit 1
          fi

          test "$tag" = "v${version}" || { echo "Release tag must match the compiled App version" >&2; exit 1; }
          test -f "GPM2.0/releases/${tag}.md" || { echo "Canonical release notes are missing" >&2; exit 1; }
          build_timestamp="$(TZ=Asia/Shanghai date +%Y%m%d%H%M%S)"

          echo "tag_name=${tag}" >> "$GITHUB_OUTPUT"
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          echo "build_timestamp=${build_timestamp}" >> "$GITHUB_OUTPUT"

      - name: Create release if needed
        env:
          GH_TOKEN: ${{ github.token }}
          TAG_NAME: ${{ steps.release-vars.outputs.tag_name }}
        shell: bash
        run: |
          set -euo pipefail

          if gh release view "$TAG_NAME" >/dev/null 2>&1; then
            test "$(gh release view "$TAG_NAME" --json isDraft --jq .isDraft)" = true || {
              echo "Refusing to replace a published release. Use a new version or the separately authorized refresh procedure." >&2
              exit 1
            }
            echo "Reusing draft Release ${TAG_NAME}."
            exit 0
          fi

          gh release create "$TAG_NAME" \
            --target "$GITHUB_SHA" \
            --draft \
            --title "GPM ${TAG_NAME}" \
            --notes "Installers for GPM ${TAG_NAME}."

      - name: Clear existing installer assets
        env:
          GH_TOKEN: ${{ github.token }}
          TAG_NAME: ${{ steps.release-vars.outputs.tag_name }}
        shell: bash
        run: |
          set -euo pipefail

          mapfile -t assets < <(
            gh release view "$TAG_NAME" --json assets --jq '.assets[].name' |
              grep -E "_(setup\\.exe|installer\\.dmg|app\\.tar\\.gz)(\\.sig)?$" || true
          )

          if (( ${#assets[@]} == 0 )); then
            echo "No existing installer assets to delete for ${TAG_NAME}."
            exit 0
          fi

          printf 'Deleting existing installer assets for %s:\n' "$TAG_NAME"
          printf '  %s\n' "${assets[@]}"
          for asset in "${assets[@]}"; do
            gh release delete-asset "$TAG_NAME" "$asset" --yes
          done

  build-windows:
    name: Build Windows ${{ matrix.asset_platform }}
    needs: prepare-release
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-pc-windows-msvc
            asset_platform: win-x86
            tauri_arch: x64
            vcvars_arg: amd64
          - target: aarch64-pc-windows-msvc
            asset_platform: win-arm64
            tauri_arch: arm64
            vcvars_arg: amd64_arm64
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: GPM2.0/app/frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: GPM2.0/app/frontend
        run: >-
          npm ci
          --registry=https://registry.npmjs.org
          --fetch-retries=5
          --fetch-retry-factor=2
          --fetch-retry-mintimeout=1000
          --fetch-retry-maxtimeout=60000

      - name: Install Rust target
        working-directory: GPM2.0
        run: rustup target add ${{ matrix.target }}

      - name: Install Tauri CLI
        run: npm install --global --registry=https://registry.npmjs.org @tauri-apps/cli@^2

      - name: Prepare updater signing config
        working-directory: GPM2.0/app/src-tauri
        run: >-
          node -e "const fs = require('node:fs');
          const config = JSON.parse(fs.readFileSync('tauri.updater.conf.json', 'utf8'));
          if (!process.env.GPM_UPDATER_PUBLIC_KEY) throw new Error('Missing updater public key');
          config.plugins = config.plugins || {};
          config.plugins.updater = { ...(config.plugins.updater || {}), pubkey: process.env.GPM_UPDATER_PUBLIC_KEY };
          fs.writeFileSync('tauri.updater.build.conf.json', JSON.stringify(config), 'utf8');"

      - name: Build NSIS installer
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        working-directory: GPM2.0/app/src-tauri
        shell: cmd
        run: |
          for /f "usebackq delims=" %%I in (`"%ProgramFiles(x86)%\Microsoft Visual Studio\Installer\vswhere.exe" -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath`) do set "VSINSTALL=%%I"
          if not defined VSINSTALL (
            echo Failed to locate Visual Studio installation.
            exit /b 1
          )
          call "%VSINSTALL%\VC\Auxiliary\Build\vcvarsall.bat" ${{ matrix.vcvars_arg }}
          if errorlevel 1 exit /b %errorlevel%
          for /l %%A in (1,1,3) do (
            echo Tauri NSIS build attempt %%A of 3.
            call tauri build --config tauri.updater.build.conf.json --bundles nsis --target ${{ matrix.target }}
            if not errorlevel 1 goto :tauri_build_succeeded
            if %%A equ 3 exit /b 1
            powershell.exe -NoLogo -NoProfile -Command "Start-Sleep -Seconds 15"
          )
          :tauri_build_succeeded

      - name: Verify Windows icons
        env:
          TARGET: ${{ matrix.target }}
          TAURI_ARCH: ${{ matrix.tauri_arch }}
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          $appExecutable = "GPM2.0/app/src-tauri/target/${env:TARGET}/release/gpm_next_desktop.exe"
          $installers = @(
            Get-ChildItem -Path "GPM2.0/app/src-tauri/target" -Recurse -Filter "*.exe" |
              Where-Object {
                $_.FullName -like "*\bundle\nsis\*" -and
                $_.Name -like "*_${env:TAURI_ARCH}-setup.exe"
              } |
              Sort-Object FullName
          )

          if ($installers.Count -ne 1) {
            Write-Error "Expected exactly one Windows installer for $env:TAURI_ARCH, found $($installers.Count): $($installers.FullName -join ', ')"
          }

          & "GPM2.0/scripts/verify-windows-icon.ps1" `
            -ExpectedIcon "GPM2.0/app/src-tauri/icons/icon.ico" `
            -ExecutablePath @($appExecutable, $installers[0].FullName)

          "WINDOWS_INSTALLER_PATH=$($installers[0].FullName)" |
            Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Upload Windows installer
        env:
          GH_TOKEN: ${{ github.token }}
          TAG_NAME: ${{ needs.prepare-release.outputs.tag_name }}
          VERSION: ${{ needs.prepare-release.outputs.version }}
          BUILD_TIMESTAMP: ${{ needs.prepare-release.outputs.build_timestamp }}
          ASSET_PLATFORM: ${{ matrix.asset_platform }}
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          if ([string]::IsNullOrWhiteSpace($env:WINDOWS_INSTALLER_PATH) -or
              -not (Test-Path -LiteralPath $env:WINDOWS_INSTALLER_PATH -PathType Leaf)) {
            Write-Error "Verified Windows installer path is missing: $env:WINDOWS_INSTALLER_PATH"
          }

          $asset = "GPM_${env:VERSION}_${env:BUILD_TIMESTAMP}_${env:ASSET_PLATFORM}_setup.exe"
          Copy-Item -LiteralPath $env:WINDOWS_INSTALLER_PATH -Destination $asset -Force
          $signature = "$($env:WINDOWS_INSTALLER_PATH).sig"
          if (-not (Test-Path -LiteralPath $signature)) { throw "Missing signed Windows updater artifact" }
          Copy-Item -LiteralPath $signature -Destination "$asset.sig"
          gh release upload $env:TAG_NAME $asset "$asset.sig" --clobber
          if ($LASTEXITCODE -ne 0) { throw "Update upload failed" }

  build-macos:
    name: Build macOS ${{ matrix.asset_platform }}
    needs: prepare-release
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15-intel
            target: x86_64-apple-darwin
            asset_platform: mac-x86
            expected_arch: x86_64
          - runner: macos-15
            target: aarch64-apple-darwin
            asset_platform: mac-arm64
            expected_arch: arm64
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: GPM2.0/app/frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: GPM2.0/app/frontend
        run: >-
          npm ci
          --registry=https://registry.npmjs.org
          --fetch-retries=5
          --fetch-retry-factor=2
          --fetch-retry-mintimeout=1000
          --fetch-retry-maxtimeout=60000

      - name: Install Rust target
        working-directory: GPM2.0
        run: rustup target add ${{ matrix.target }}

      - name: Install Tauri CLI
        run: npm install --global --registry=https://registry.npmjs.org @tauri-apps/cli@^2

      - name: Prepare updater signing config
        working-directory: GPM2.0/app/src-tauri
        run: >-
          node -e "const fs = require('node:fs');
          const config = JSON.parse(fs.readFileSync('tauri.updater.conf.json', 'utf8'));
          if (!process.env.GPM_UPDATER_PUBLIC_KEY) throw new Error('Missing updater public key');
          config.plugins = config.plugins || {};
          config.plugins.updater = { ...(config.plugins.updater || {}), pubkey: process.env.GPM_UPDATER_PUBLIC_KEY };
          fs.writeFileSync('tauri.updater.build.conf.json', JSON.stringify(config), 'utf8');"

      - name: Build DMG
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        working-directory: GPM2.0/app/src-tauri
        run: tauri build --config tauri.updater.build.conf.json --bundles app,dmg --target ${{ matrix.target }}

      - name: Verify macOS installer
        env:
          EXPECTED_ARCH: ${{ matrix.expected_arch }}
        shell: bash
        run: |
          set -euo pipefail

          dmg_count=0
          dmg=""
          while IFS= read -r candidate; do
            [[ -n "$candidate" ]] || continue
            dmg_count=$((dmg_count + 1))
            dmg="$candidate"
          done < <(find GPM2.0/app/src-tauri/target -path "*/release/bundle/dmg/*.dmg" -type f | sort)
          if (( dmg_count != 1 )); then
            printf 'Expected exactly one DMG, found %s:\n' "$dmg_count" >&2
            find GPM2.0/app/src-tauri/target -path "*/release/bundle/dmg/*.dmg" -type f | sort >&2
            exit 1
          fi

          hdiutil verify "$dmg"

          mount_dir="$(mktemp -d)"
          mounted=false
          cleanup_mount() {
            if [[ "$mounted" == "true" ]]; then
              hdiutil detach "$mount_dir"
            fi
            rmdir "$mount_dir"
          }
          trap cleanup_mount EXIT

          hdiutil attach "$dmg" -nobrowse -readonly -mountpoint "$mount_dir"
          mounted=true

          app_count=0
          app=""
          for candidate in "$mount_dir"/*.app; do
            if [[ -d "$candidate" ]]; then
              app_count=$((app_count + 1))
              app="$candidate"
            fi
          done
          if (( app_count != 1 )); then
            printf 'Expected exactly one top-level app bundle, found %s.\n' "$app_count" >&2
            exit 1
          fi

          expected_icon="GPM2.0/app/src-tauri/icons/icon-macos.icns"
          expected_icon_name="$(basename "$expected_icon")"
          bundled_icon_name="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIconFile' "$app/Contents/Info.plist")"
          if [[ "$bundled_icon_name" != "$expected_icon_name" ]]; then
            printf 'Expected CFBundleIconFile %s, found %s.\n' "$expected_icon_name" "$bundled_icon_name" >&2
            exit 1
          fi
          bundled_icon="$app/Contents/Resources/$bundled_icon_name"
          if [[ ! -f "$bundled_icon" ]]; then
            printf 'Bundled macOS icon not found: %s\n' "$bundled_icon" >&2
            exit 1
          fi
          if ! cmp "$expected_icon" "$bundled_icon"; then
            printf 'Bundled macOS icon does not match %s.\n' "$expected_icon" >&2
            exit 1
          fi

          codesign --verify --deep --strict --verbose=2 "$app"
          signature_details="$(codesign -d --verbose=4 "$app" 2>&1)"
          printf '%s\n' "$signature_details"
          if ! grep -Fxq 'Signature=adhoc' <<< "$signature_details"; then
            printf 'Expected an ad-hoc app signature.\n' >&2
            exit 1
          fi

          executable="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleExecutable' "$app/Contents/Info.plist")"
          executable_path="$app/Contents/MacOS/$executable"
          if [[ ! -f "$executable_path" ]]; then
            printf 'Bundle executable not found: %s\n' "$executable_path" >&2
            exit 1
          fi

          actual_arch="$(lipo -archs "$executable_path")"
          if [[ "$actual_arch" != "$EXPECTED_ARCH" ]]; then
            printf 'Expected executable architecture %s, found %s.\n' "$EXPECTED_ARCH" "$actual_arch" >&2
            exit 1
          fi

          hdiutil detach "$mount_dir"
          mounted=false
          rmdir "$mount_dir"
          trap - EXIT
          printf 'DMG_PATH=%s\n' "$dmg" >> "$GITHUB_ENV"

      - name: Upload macOS installer
        env:
          GH_TOKEN: ${{ github.token }}
          TAG_NAME: ${{ needs.prepare-release.outputs.tag_name }}
          VERSION: ${{ needs.prepare-release.outputs.version }}
          BUILD_TIMESTAMP: ${{ needs.prepare-release.outputs.build_timestamp }}
          ASSET_PLATFORM: ${{ matrix.asset_platform }}
        shell: bash
        run: |
          set -euo pipefail

          if [[ -z "${DMG_PATH:-}" || ! -f "$DMG_PATH" ]]; then
            printf 'Verified DMG path is missing: %s\n' "${DMG_PATH:-<unset>}" >&2
            exit 1
          fi

          asset="GPM_${VERSION}_${BUILD_TIMESTAMP}_${ASSET_PLATFORM}_installer.dmg"
          cp "$DMG_PATH" "$asset"
          updater="GPM_${VERSION}_${BUILD_TIMESTAMP}_${ASSET_PLATFORM}_app.tar.gz"
          mapfile_candidates=()
          while IFS= read -r candidate; do mapfile_candidates+=("$candidate"); done < <(find GPM2.0/app/src-tauri/target -path "*/release/bundle/macos/*.app.tar.gz" -type f)
          test "${#mapfile_candidates[@]}" -eq 1
          cp "${mapfile_candidates[0]}" "$updater"
          cp "${mapfile_candidates[0]}.sig" "$updater.sig"
          gh release upload "$TAG_NAME" "$asset" "$updater" "$updater.sig" --clobber

          download_dir="$(mktemp -d)"
          cleanup_download() {
            rm -rf "$download_dir"
          }
          trap cleanup_download EXIT
          gh release download "$TAG_NAME" --pattern "$asset" --dir "$download_dir"
          cmp "$asset" "$download_dir/$asset"

  update-feed:
    name: Generate signed App update feed
    needs: [prepare-release, build-windows, build-macos]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install independent signature verifier
        run: sudo apt-get update && sudo apt-get install -y minisign
      - name: Download completed draft bundles and generate localized feed
        env:
          GH_TOKEN: ${{ github.token }}
          TAG_NAME: ${{ needs.prepare-release.outputs.tag_name }}
          VERSION: ${{ needs.prepare-release.outputs.version }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p update-assets update-feed
          gh release download "$TAG_NAME" --dir update-assets
          python3 GPM2.0/scripts/app-update-feed.py build --version "$VERSION" --assets update-assets --output update-feed
          gh release upload "$TAG_NAME" update-feed/GPM_*_notes_*.txt update-feed/latest.json --clobber
          # Keep the Release draft: canonical notes, Server source, retained test data,
          # public verification and docs promotion remain release-operator gates.
          echo "Draft update feed is ready. Complete RELEASING.md before publication." >> "$GITHUB_STEP_SUMMARY"
