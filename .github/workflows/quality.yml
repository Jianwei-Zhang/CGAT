name: GPM2.0 Quality

on:
  pull_request:
  push:
    branches:
      - master
  workflow_dispatch:
    inputs:
      full:
        description: Run the full backend and Tauri quality gate
        required: true
        default: true
        type: boolean
  workflow_call:
    inputs:
      full:
        description: Run the full backend and Tauri quality gate
        required: false
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: gpm2-quality-${{ github.workflow }}-${{ inputs.full && github.run_id || github.ref }}
  cancel-in-progress: ${{ !inputs.full && (github.event_name == 'push' || github.event_name == 'pull_request') }}

jobs:
  windows-app:
    name: Windows app
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: GPM2.0/app/frontend/package-lock.json

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install frontend dependencies
        working-directory: GPM2.0/app/frontend
        run: >-
          npm ci
          --registry=https://registry.npmjs.org
          --fetch-retries=5
          --fetch-retry-factor=2
          --fetch-retry-mintimeout=1000
          --fetch-retry-maxtimeout=60000

      - name: Install Rust quality components
        if: ${{ inputs.full }}
        working-directory: GPM2.0
        run: rustup component add rustfmt clippy

      - name: Run Windows quality gate
        working-directory: GPM2.0
        shell: pwsh
        env:
          QUALITY_MODE: ${{ inputs.full && 'Full' || 'Light' }}
        run: ./scripts/quality-gate-windows.ps1 -Mode $env:QUALITY_MODE

  linux-server:
    name: Linux server
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: GPM2.0/app/frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: GPM2.0/app/frontend
        run: >-
          npm ci
          --registry=https://registry.npmjs.org
          --fetch-retries=5
          --fetch-retry-factor=2
          --fetch-retry-mintimeout=1000
          --fetch-retry-maxtimeout=60000

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Rust quality components
        working-directory: GPM2.0
        run: rustup component add rustfmt clippy

      - name: Install parallel compression
        run: sudo apt-get update && sudo apt-get install -y pigz

      - name: Run server quality gate
        working-directory: GPM2.0
        run: bash scripts/quality-gate-server.sh
