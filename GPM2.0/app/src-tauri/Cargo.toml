[package]
name = "gpm_next_desktop"
version = "2.0.14"
edition = "2024"

[lib]
name = "gpm_next_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.5.6", features = [] }

[dependencies]
anyhow = "1.0"
base64 = "0.22"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "stream"] }
semver = "1"
sha2 = "0.10"
tokio = { version = "1", features = ["time", "macros"] }
tauri-plugin-updater = "=2.14.0"
gpm_next_backend = { path = "../backend" }
rfd = "0.15"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tauri = { version = "2.12.5", features = [] }

[dev-dependencies]
tauri = { version = "2.12.5", features = ["test"] }

# Keep native import hot paths optimized in the interactive debug app too.
# Cargo uses the root manifest's profiles, so mirror these in both crates.
[profile.dev.package.sha2]
opt-level = 3

[profile.dev.package.libsqlite3-sys]
opt-level = 3

# Optimize the data-processing crate while retaining debug symbols and the
# unoptimized Tauri/UI crate. Per-base FASTA loops otherwise dominate dev import.
[profile.dev.package.gpm_next_backend]
opt-level = 2
