[package]
name = "gpm_next_backend"
version = "2.0.10"
edition = "2024"

[dependencies]
anyhow = "1.0"
clap = { version = "4.5", features = ["derive"] }
csv = "1.3"
flate2 = "1.1"
rusqlite = { version = "0.31", features = ["bundled"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
tar = "0.4"
zip = { version = "0.6.6", default-features = false, features = ["deflate"] }

[dev-dependencies]
tempfile = "3.20"

# Keep native import hot paths optimized in the interactive debug app too.
# Cargo uses the root manifest's profiles, so mirror these in both crates.
[profile.dev.package.sha2]
opt-level = 3

[profile.dev.package.libsqlite3-sys]
opt-level = 3
